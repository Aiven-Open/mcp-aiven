# Service integration tools: CRUD for integrations between Aiven services and external endpoints

tools:
  - name: aiven_service_integration_list
    method: GET
    path: /project/{project}/service/{service_name}/integration
    category: integrations
    readOnly: true
    append_list_picker_hint: true
    response_filter:
      key: service_integrations
      fields:
        [
          service_integration_id,
          integration_type,
          source_project,
          source_service,
          source_service_type,
          source_endpoint_id,
          dest_project,
          dest_service,
          dest_service_type,
          dest_endpoint_id,
          enabled,
          active,
          user_config,
        ]
      search_fields: [integration_type, source_service, dest_service]
    description: |
      List integrations where the named service is either the source or destination. The result includes IDs, both sides of the integration, service types, status, and user_config so an existing integration can be inspected or selected for update or deletion.

      An `application_service_credential` integration is created at the project level, not on either service. Set PostgreSQL, Valkey, Kafka, or OpenSearch as `source_service` and the application service as `dest_service`. The integration appears when listing integrations for either service. `user_config.exposed_values` contains `environment_variable_key` configuration, not the values injected into the application service.

      The MCP schema currently describes `application_service_credential` in detail. Aiven supports other integration types too.

  - name: aiven_service_integration_create
    method: POST
    path: /project/{project}/integration
    category: integrations
    destructive: true
    openWorld: true
    description: |
      Create a service integration between two Aiven services, or between an Aiven service and an external integration endpoint.

      For `application_service_credential`, connect a source service to a destination application service:
      - Set `source_service` to an existing PostgreSQL, Valkey, Kafka, or OpenSearch service.
      - Set `dest_service` to the existing application.
      - Set `integration_type` to `application_service_credential`.
      - Supply `user_config` and every `environment_variable_key` explicitly. Inspect what the destination application service reads, including accepted aliases. The MCP supplies no defaults.
      - Do not use `source_endpoint_id` or `dest_endpoint_id`.

      Before calling for any other integration type, use `aiven_integration_types_list` to discover valid types and source/destination combinations. Provide `source_service`/`dest_service` for Aiven-to-Aiven integrations, or endpoint IDs for external endpoints. The schemas in this tool describe `application_service_credential` in detail. Other Aiven integration types remain supported through their API-defined `user_config`.

  - name: aiven_service_integration_get
    method: GET
    path: /project/{project}/integration/{integration_id}
    category: integrations
    readOnly: true
    description: |
      Get a service integration by ID. Returns its type, source, destination, status, and user_config.

      Call this before updating an integration and preserve its complete `user_config`. For `application_service_credential`, `user_config.exposed_values` contains `environment_variable_key` configuration, not the values injected into the destination application service.

      The MCP schema currently describes `application_service_credential` in detail. Aiven supports other integration types too.

  - name: aiven_service_integration_update
    method: PUT
    path: /project/{project}/integration/{integration_id}
    category: integrations
    destructive: true
    openWorld: true
    description: |
      Update the configuration of an existing service integration.

      Call `aiven_service_integration_get` first, then submit a complete `user_config` that preserves required fields. For `application_service_credential`, keep `service_type`, inspect what the destination application service reads (including accepted aliases), and explicitly provide every `environment_variable_key`. The MCP fetches the existing integration and validates `user_config` before sending the update.

      Only `user_config` can be updated. You cannot change `integration_type`, `source_service`, `dest_service`, or `user_config.service_type`. To change any of those, delete and recreate the integration.

      The MCP schema currently describes `application_service_credential` in detail. Other Aiven integration types remain supported through their API-defined `user_config`.

  - name: aiven_service_integration_delete
    method: DELETE
    path: /project/{project}/integration/{integration_id}
    category: integrations
    openWorld: true
    description: |
      Delete a service integration. This removes the connection between the source and destination services.

      For `application_service_credential`, this removes the source service → destination application service integration. Use list/get to verify `service_integration_id`, `source_service`, and `dest_service` first.

      **Warning:** Deleting an integration may disrupt application access, metrics, logs, replication, or other data flows. Confirm with the user before proceeding. The MCP schema currently describes `application_service_credential` in detail. Aiven supports other integration types too.

  - name: aiven_integration_types_list
    method: GET
    path: /project/{project}/integration_types
    category: integrations
    readOnly: true
    append_list_picker_hint: true
    response_filter:
      key: integration_types
      fields: [integration_type, source_service_types, dest_service_types]
      search_fields: [integration_type]
    description: |
      List all available service integration types for a project. Returns the integration type name along with the valid source and destination service types for each.

      **Call this first** before creating an integration to understand which service types can be connected and in which direction.

  - name: aiven_integration_endpoint_types_list
    method: GET
    path: /project/{project}/integration_endpoint_types
    category: integrations
    readOnly: true
    append_list_picker_hint: true
    response_filter:
      key: endpoint_types
      fields: [endpoint_type, title, service_types]
      search_fields: [endpoint_type]
    description: |
      List all available integration endpoint types for a project. Integration endpoints represent external services (e.g. Datadog, external Elasticsearch, Prometheus remote write, rsyslog, AWS CloudWatch, Google Cloud Logging).

      Use this to discover what external endpoint types can be created, then use `aiven_service_integration_create` with the endpoint ID to wire an Aiven service to the external system.
